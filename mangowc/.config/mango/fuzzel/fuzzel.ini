font=Dank Mono:weight=bold:size=12
line-height=18
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯   " 
layer=overlay3
lines=10

[colors]
background=1e1e2edd
text=cdd6f4ff
match=f38ba8ff
selection=585b70ff
selection-match=f38ba8ff
selection-text=cdd6f4ff
border=b4befeff


[colors]
background=0f241fdd          # deep darkened #1a3b35 base (semi-transparent for blur effect)
text=d8e8e5ff               # soft pale teal-gray (high readability, low eye strain)
match=4a8a7fff              # accentuated lift of base (muted teal-green highlight for matches)
selection=1e3a35cc          # darker muted shade for selected item (subtle contrast)
selection-match=5a9e8fff    # brighter accent on selected match
selection-text=f0f9f7ff     # near-white with tiny teal tint for selected text
border=3a6b5fee  

[border]
radius=20
width=3
